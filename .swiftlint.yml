included:
  - Benchmarks
  - Sources
  - Tests
  - spikes/claude-usage/Sources
  - spikes/claude-usage/Tests
  - spikes/cursor-usage/Sources
  - spikes/cursor-usage/Tests
  - spikes/grok-usage/Sources
  - spikes/grok-usage/Tests
  - spikes/github-copilot-usage/Sources
  - spikes/github-copilot-usage/Tests

excluded:
  - .build
  - DerivedData

opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - fallthrough
  - first_where
  - force_unwrapping
  - identical_operands
  - last_where
  - legacy_multiple
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_in_static_references
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

line_length:
  warning: 100
  error: 120
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 450
  error: 600

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id

type_name:
  excluded:
    - ID

trailing_comma:
  mandatory_comma: true

reporter: xcode
