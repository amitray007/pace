name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: format · lint · test · build
    # Pace is a macOS application: it builds against AppKit and the macOS 15
    # SDK, so it cannot be verified on a Linux runner.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # The runner's default Xcode is older than this project needs, and the
      # image's exact point releases change over time. Pick the newest
      # installed Xcode rather than pinning a path that gets removed.
      - name: select the newest Xcode
        run: |
          set -euo pipefail
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null \
            | sed 's|.*/Xcode_||; s|\.app$||' \
            | sort -V | tail -1)
          test -n "$NEWEST" || { echo "::error::no versioned Xcode found"; exit 1; }
          echo "Selecting Xcode $NEWEST"
          sudo xcode-select -switch "/Applications/Xcode_${NEWEST}.app"
          swift --version

      - name: report toolchain
        run: |
          swift --version
          xcodebuild -version

      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: install xcodegen
        run: brew install xcodegen

      # Same four steps as `make check`, run separately so a failure names
      # itself in the job list rather than hiding inside one target.
      - name: format
        run: make format-check

      - name: lint
        run: make lint

      - name: test
        run: make test

      - name: build
        run: make build

  release-preflight:
    name: release bundle verification
    runs-on: macos-15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # The runner's default Xcode is older than this project needs, and the
      # image's exact point releases change over time. Pick the newest
      # installed Xcode rather than pinning a path that gets removed.
      - name: select the newest Xcode
        run: |
          set -euo pipefail
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null \
            | sed 's|.*/Xcode_||; s|\.app$||' \
            | sort -V | tail -1)
          test -n "$NEWEST" || { echo "::error::no versioned Xcode found"; exit 1; }
          echo "Selecting Xcode $NEWEST"
          sudo xcode-select -switch "/Applications/Xcode_${NEWEST}.app"
          swift --version

      - name: install xcodegen
        run: brew install xcodegen

      # Builds the Release configuration and checks the produced bundle's
      # identifier, version, and minimum system version. This catches a broken
      # release build on every pull request rather than at tag time.
      - name: verify the release bundle
        run: make release-preflight
