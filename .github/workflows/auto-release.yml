name: Auto release

# Cuts a patch release for every push to main that changes what ships.
#
# The version is derived from the latest v* tag rather than stored in the
# repository, so there is no version commit to push back to main and no chance
# of the file and the tag disagreeing. `make release-archive` already injects
# RELEASE_VERSION at build time.
#
# Pushes that only touch documentation, media, or workflow files do not
# release: a README fix should not ask every user to approve their keychain
# items again for a new binary. Edit the paths-ignore list to change that.
#
# Failure path: the release is created only after the build, the bundle
# verification, and the artifact smoke test all pass, so a failed run publishes
# nothing and leaves no tag behind.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      bump:
        description: Which component to increase
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write # create the tag and the release

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    name: version · build · publish
    runs-on: macos-26
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0 # tags are the version source

      - name: select the newest Xcode
        run: |
          set -euo pipefail
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null \
            | sed 's|.*/Xcode_||; s|\.app$||' \
            | sort -V | tail -1)
          test -n "$NEWEST" || { echo "::error::no versioned Xcode found"; exit 1; }
          sudo xcode-select -switch "/Applications/Xcode_${NEWEST}.app"
          swift --version

      - name: install xcodegen
        run: brew install xcodegen

      - name: work out the next version
        id: version
        run: |
          set -euo pipefail
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then
            # First release. project.yml's MARKETING_VERSION is the starting
            # point so the first tag matches what the repository already claims.
            NEXT=$(grep -m1 'MARKETING_VERSION:' project.yml | sed 's/.*: *//')
            echo "no tags yet, starting at $NEXT"
          else
            CURRENT="${LATEST#v}"
            IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "${{ inputs.bump || 'patch' }}" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              *)     PATCH=$((PATCH + 1)) ;;
            esac
            NEXT="${MAJOR}.${MINOR}.${PATCH}"
            echo "$LATEST -> v$NEXT"
          fi
          if git rev-parse "v$NEXT" >/dev/null 2>&1; then
            echo "::error::tag v$NEXT already exists"; exit 1
          fi
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tap_tag=pace-v$NEXT" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: focused verification
        run: |
          make lint
          make test

      # Builds Release, checks the bundle's identifier, version, and minimum
      # system version, zips it, and writes a SHA-256 beside it.
      - name: build and package the release archive
        id: package
        run: |
          set -euo pipefail
          make release-archive \
            RELEASE_VERSION='${{ steps.version.outputs.version }}' \
            RELEASE_BUILD_NUMBER='${{ steps.version.outputs.build }}' \
            | tee package.log
          SHA="$(awk -F= '/^sha256=/{print $2}' package.log)"
          ARCHIVE="$(awk -F= '/^archive=/{print $2}' package.log)"
          test -n "$SHA" || { echo "::error::no sha256 in package output"; exit 1; }
          test -f "$ARCHIVE" || { echo "::error::archive missing: $ARCHIVE"; exit 1; }
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      # Unpacks and launches the archive that will actually ship rather than
      # trusting that the source built.
      - name: smoke-test the produced artifact
        run: |
          make release-smoke \
            RELEASE_VERSION='${{ steps.version.outputs.version }}' \
            RELEASE_BUILD_NUMBER='${{ steps.version.outputs.build }}'

      # Everything above is local to the runner. The tag is created only once
      # the artifact exists and works, so a failed run leaves nothing behind.
      - name: tag and release on this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          gh release create "v$VERSION" \
            '${{ steps.package.outputs.archive }}' \
            '${{ steps.package.outputs.archive }}.sha256' \
            --target '${{ github.sha }}' \
            --title "Pace $VERSION" \
            --generate-notes

      - name: publish the archive to the homebrew-tap release
        if: vars.HOMEBREW_TAP_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          TAP_TAG='${{ steps.version.outputs.tap_tag }}'
          # Recreate the tag if a previous attempt left one behind.
          if gh release view "$TAP_TAG" --repo amitray007/homebrew-tap >/dev/null 2>&1; then
            gh release delete "$TAP_TAG" --repo amitray007/homebrew-tap --yes --cleanup-tag || \
              gh release delete "$TAP_TAG" --repo amitray007/homebrew-tap --yes
            gh api -X DELETE "repos/amitray007/homebrew-tap/git/refs/tags/$TAP_TAG" 2>/dev/null || true
          fi
          gh release create "$TAP_TAG" \
            '${{ steps.package.outputs.archive }}' \
            '${{ steps.package.outputs.archive }}.sha256' \
            --repo amitray007/homebrew-tap \
            --title "Pace ${{ steps.version.outputs.version }}" \
            --notes "Pace ${{ steps.version.outputs.version }} — \`brew install --cask amitray007/tap/pace\`. Source: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}"

      - name: checkout homebrew-tap
        if: vars.HOMEBREW_TAP_ENABLED == 'true'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: amitray007/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: render and push the cask to the tap
        if: vars.HOMEBREW_TAP_ENABLED == 'true'
        run: |
          set -euo pipefail
          sed -e "s|{{VERSION}}|${{ steps.version.outputs.version }}|g" \
              -e "s|{{BUILD_NUMBER}}|${{ steps.version.outputs.build }}|g" \
              -e "s|{{SHA256}}|${{ steps.package.outputs.sha256 }}|g" \
              packaging/pace-cask.template.rb > homebrew-tap/Casks/pace.rb
          # An unrendered placeholder would publish a broken cask.
          ! grep -q '{{' homebrew-tap/Casks/pace.rb
          cd homebrew-tap
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Casks/pace.rb
          git commit --no-verify -m "pace: bump to ${{ steps.version.outputs.version }}"
          git push
